[tools]
node = "22.18.0"
bun = "1.3.14"

[tasks.install]
description = "Install locked development dependencies"
run = "bun install --frozen-lockfile"

[tasks.typecheck]
description = "Check TypeScript types"
depends = ["install"]
run = "npm run typecheck"

[tasks.test]
description = "Run unit tests with Vitest"
depends = ["install"]
run = "npm test"

[tasks.validate]
description = "Validate skill metadata and collection layout"
depends = ["install"]
run = "node scripts/validate-skills.ts"

[tasks.check]
description = "Run all CI checks"
depends = ["lint", "typecheck", "test", "validate"]

[tasks.lint]
description = "Check formatting and lint rules with Biome"
depends = ["install"]
run = "npm run lint"

[tasks.format]
description = "Apply Biome formatting and safe fixes"
depends = ["install"]
run = "npm run format"

[tasks."release:check"]
description = "Run checks and require a nonempty skill catalog"
depends = ["check"]
run = "node scripts/validate-skills.ts --require-skills"

[tasks."skills:list"]
description = "Check local discovery with the skills CLI"
run = "bunx skills add . --list"

[tasks."eval:prepare"]
description = "Install pinned Lux and link the incur Prism build for evaluation"
run = '''
bun install --cwd evals --frozen-lockfile
prism_cache="$PWD/evals/.lux-cache/$(basename "${PRISM_ROOT:-$PWD/../prism}")/bin"
mkdir -p "$prism_cache"
ln -sf "${PRISM_ROOT:-$PWD/../prism}/lib/run.js" "$prism_cache/prism"
"$prism_cache/prism" components init --schema --format json > "${prism_cache%/bin}/prism-init.schema.json"
'''

[tasks."eval:doctor"]
description = "Validate Lux cases and driver availability without model calls"
depends = ["install", "eval:prepare"]
dir = "evals"
run = "npm run doctor"

[tasks."eval:run"]
description = "Run component evaluations across Claude Code, Codex, and Grok Build"
depends = ["eval:doctor"]
dir = "evals"
run = "node run-components.ts --verbose"

[tasks."eval:cni"]
description = "Run local CNI evaluations across Claude Code, Codex, and Grok Build"
depends = ["eval:doctor"]
dir = "evals"
run = "node run-integrations.ts --verbose"

[tasks."eval:migrations"]
description = "Run migration evaluations across the shared agent profiles"
depends = ["eval:doctor"]
dir = "evals"
run = "node run-migrations.ts --verbose"
