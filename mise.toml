[tools]
node = "22.18.0"
bun = "1.3.14"

[tasks.install]
description = "Install locked development dependencies"
run = "bun install --frozen-lockfile"

[tasks.typecheck]
description = "Check TypeScript types"
depends = ["install"]
run = "node node_modules/typescript/bin/tsc --noEmit"

[tasks.test]
description = "Run tests on Node"
depends = ["install"]
run = "node --test scripts/*.test.ts"

[tasks.validate]
description = "Validate skill metadata and collection layout"
depends = ["install"]
run = "node scripts/validate-skills.ts"

[tasks.check]
description = "Run all CI checks"
depends = ["lint", "typecheck", "test", "validate"]

[tasks.lint]
description = "Check formatting and lint rules with Biome"
depends = ["install"]
run = "node node_modules/@biomejs/biome/bin/biome check ."

[tasks.format]
description = "Apply Biome formatting and safe fixes"
depends = ["install"]
run = "node node_modules/@biomejs/biome/bin/biome check --write ."

[tasks."release:check"]
description = "Run checks and require a nonempty skill catalog"
depends = ["check"]
run = "node scripts/validate-skills.ts --require-skills"

[tasks."skills:list"]
description = "Check local discovery with the skills CLI"
run = "bunx skills add . --list"

[tasks."eval:prepare"]
description = "Link local Lux and incur Prism builds for evaluation"
run = '''
bun install --cwd evals --frozen-lockfile
mkdir -p evals/.lux-cache/bin
ln -sf "${PRISM_ROOT:-$PWD/../prism}/lib/run.js" evals/.lux-cache/bin/prism
evals/.lux-cache/bin/prism components init --schema --format json > evals/.lux-cache/prism-init.schema.json
'''

[tasks."eval:doctor"]
description = "Validate Lux cases and driver availability without model calls"
depends = ["install", "eval:prepare"]
dir = "evals"
run = ["node ../node_modules/typescript/bin/tsc --noEmit", "node node_modules/@prismatic-io/lux/lib/cli/bin.js doctor"]

[tasks."eval:run"]
description = "Run the inaugural Files.com connector evaluation"
depends = ["eval:doctor"]
dir = "evals"
run = "node node_modules/@prismatic-io/lux/lib/cli/bin.js run prismatic-components/files-com --verbose"
