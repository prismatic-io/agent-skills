[tools]
node = "22.18.0"
npm = "11.19.0"
bun = "1.3.14"

[tasks.install]
description = "Install locked development dependencies"
run = "bun install --frozen-lockfile"

[tasks.typecheck]
description = "Check TypeScript types"
depends = ["install"]
run = "npm run typecheck"

[tasks.test]
description = "Run unit tests with Vitest"
depends = ["install"]
run = "npm test"

[tasks.validate]
description = "Validate skill metadata and collection layout"
depends = ["install"]
run = "node scripts/validate-skills.ts"

[tasks.check]
description = "Run all CI checks"
depends = ["lint", "typecheck", "test", "validate"]

[tasks.lint]
description = "Check formatting and lint rules with Biome"
depends = ["install"]
run = "npm run lint"

[tasks.format]
description = "Apply Biome formatting and safe fixes"
depends = ["install"]
run = "npm run format"

[tasks."release:check"]
description = "Run checks and require a nonempty skill catalog"
depends = ["check"]
run = "node scripts/validate-skills.ts --require-skills"

[tasks."skills:list"]
description = "Check local discovery with the skills CLI"
run = "bunx skills add . --list"

[tasks."eval:prepare"]
description = "Install Lux and capture the native Prism scaffold contract"
run = '''
bun install --cwd evals --frozen-lockfile
if [ -n "${LUX_PACKAGE:-}" ]; then
  npm install --prefix evals --no-save --package-lock=false --no-audit --no-fund "$LUX_PACKAGE"
fi
prism_root="$(node -p 'require("node:path").resolve(process.env.PRISM_ROOT ?? "../prism")')"
prism_cache="$PWD/evals/.lux-cache/$(basename "$prism_root")"
mkdir -p "$prism_cache/bin"
ln -sf "$prism_root/lib/run.js" "$prism_cache/bin/prism"
"$prism_cache/bin/prism" components init --schema --format json > "$prism_cache/prism-init.schema.json"
'''

[tasks."eval:doctor"]
description = "Validate Lux cases and driver availability without model calls"
depends = ["install", "eval:prepare"]
dir = "evals"
run = "npm run doctor"

[tasks."eval:run"]
description = "Run native Lux; select a skill name or canonical case ID"
depends = ["eval:prepare"]
dir = "evals"
run = "node node_modules/@prismatic-io/lux/lib/cli/bin.js run"

[tasks."eval:check"]
description = "Check eval types and helpers without model calls"
depends = ["install", "eval:prepare"]
dir = "evals"
run = "npm run typecheck && npm test"
